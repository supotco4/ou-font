<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Өү — удирдлага</title>
<style>
  :root{ --bg:#f6f6f3; --surface:#fff; --ink:#111113; --soft:#6b6b72; --faint:#a1a1a8; --line:rgba(17,17,19,.08); --line2:rgba(17,17,19,.14);
    --accent:#2f54eb; --accent-ink:#fff; --tile:#fafaf8; --bad:#e5484d; --ok:#16a34a; --warn:#b45309 }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0d0d0f; --surface:#151518; --ink:#f3f3f5; --soft:#9d9da6; --faint:#6a6a73;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14); --accent:#7b93ff; --accent-ink:#0d0d0f; --tile:#1a1a1e; --bad:#ff6b6f; --ok:#4ade80; --warn:#fbbf24 } }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 20px 80px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  header h1{font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1}
  header a{color:var(--soft);text-decoration:none;font-size:13px}
  .login{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:12px}
  .login h2{font-size:18px}
  input,textarea{font:inherit;padding:10px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
  .btn{font:600 13px/1 Inter,system-ui,sans-serif;border:0;border-radius:99px;padding:9px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
  a.btn{text-decoration:none;display:inline-block}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
  .btn.bad{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb, var(--bad) 40%, transparent)}
  .btn:disabled{opacity:.4;cursor:default}
  .tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:18px;flex-wrap:wrap}
  .tabs button{font:600 13.5px/1 Inter,system-ui,sans-serif;border:0;background:transparent;color:var(--soft);padding:9px 16px;border-radius:99px;cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
  .card b{display:block;font-size:26px;letter-spacing:-.02em}
  .card span{color:var(--soft);font-size:13px}
  .chart{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 8px;margin-bottom:18px}
  .bars{display:flex;align-items:flex-end;gap:4px;height:160px}
  .bars .b{flex:1;min-width:6px;background:var(--accent);border-radius:4px 4px 0 0;position:relative}
  .bars .b:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:8px;margin-bottom:4px;z-index:2}
  .axis{display:flex;justify-content:space-between;color:var(--faint);font-size:11.5px;margin-top:6px}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
  th{color:var(--soft);font-weight:600;font-size:12.5px;background:var(--tile)}
  tr:last-child td{border-bottom:0}
  td .sub{color:var(--faint);font-size:12px}
  td .msg{white-space:pre-wrap;word-wrap:break-word;max-width:460px}
  td.acts{white-space:nowrap}
  td.acts .btn{margin:0 2px 4px 0}
  .st{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .st.public{background:color-mix(in srgb, var(--ok) 15%, transparent);color:var(--ok)}
  .st.hidden,.st.removed{background:color-mix(in srgb, var(--bad) 14%, transparent);color:var(--bad)}
  .st.held{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
  .pv{font-size:26px;line-height:1.1;min-width:80px}
  .filter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .filter label{font-size:13px;color:var(--soft);display:flex;gap:6px;align-items:center}
  .empty{padding:30px;text-align:center;color:var(--faint)}
  .err{color:var(--bad);font-size:13px}
  .reply{display:flex;gap:6px;margin-top:6px}
  .reply input{flex:1;padding:6px 10px;font-size:13px}
  @media (max-width:700px){ th:nth-child(3),td:nth-child(3){display:none} td.acts{white-space:normal} td.acts .btn{padding:8px 11px} }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login" hidden>
    <h2>Өү — удирдлага</h2>
    <p style="color:var(--soft);font-size:13.5px">Удирдлагын түлхүүрээ оруулна уу. Энэ хөтөч дээр хадгалагдана.</p>
    <input id="key" type="password" placeholder="ou-…" autocomplete="current-password" aria-label="Түлхүүр">
    <button class="btn" id="go" type="button">Нэвтрэх</button>
    <div class="err" id="loginErr" role="alert"></div>
  </div>
  <div id="app" hidden>
    <header>
      <h1>Өү — удирдлага</h1>
      <a href="/">Сайт</a><a href="/fontsan/">Фонт сан</a><a href="/sanal/">Санал хүсэлт</a>
      <button class="btn ghost" id="out" type="button">Гарах</button>
    </header>
    <div class="tabs" role="tablist">
      <button role="tab" data-t="stats" aria-selected="true">Статистик</button>
      <button role="tab" data-t="fonts" aria-selected="false">Фонтууд</button>
      <button role="tab" data-t="comments" aria-selected="false">Сэтгэгдэл</button>
      <button role="tab" data-t="feedback" aria-selected="false">Санал хүсэлт</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  let KEY = ''; try { KEY = localStorage.getItem('ou-admin') || ''; } catch (e) {}
  const api = async (path, opt = {}) => {
    const r = await fetch('/api/admin/' + path, { ...opt, headers: { 'x-admin-key': KEY, 'content-type': 'application/json', ...(opt.headers || {}) } });
    if (r.status === 403) { showLogin('Түлхүүр буруу байна.'); throw new Error('forbidden'); }
    return r.json();
  };
  const act = (kind, id, action, extra) => api('action', { method: 'POST', body: JSON.stringify({ kind, id, action, ...(extra || {}) }) });
  const jst = s => String(s || '').replace(' ', 'T') ? new Date(String(s).replace(' ', 'T') + 'Z').toLocaleString('mn-MN', { timeZone: 'Asia/Tokyo', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  const STL = { public: 'Нийтэд', hidden: 'Нуусан', held: 'Хүлээгдэж буй', removed: 'Эзэн нь авсан' };

  function showLogin(msg) { $('app').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg || ''; $('key').focus(); }
  async function start() {
    try { await api('stats'); } catch (e) { return; }
    $('login').hidden = true; $('app').hidden = false; tab('stats');
  }
  $('go').onclick = () => { KEY = $('key').value.trim(); try { localStorage.setItem('ou-admin', KEY); } catch (e) {} start(); };
  $('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
  $('out').onclick = () => { try { localStorage.removeItem('ou-admin'); } catch (e) {} KEY = ''; showLogin(); };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => tab(b.dataset.t));

  async function tab(t) {
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
    const v = $('view'); v.innerHTML = ''; v.appendChild(el('div', 'empty', 'Ачаалж байна…'));
    try { await ({ stats, fonts, comments, feedback })[t](v); } catch (e) { if (e.message !== 'forbidden') { v.innerHTML = ''; v.appendChild(el('div', 'err', 'Алдаа: ' + e.message)); } }
  }
  function statusCell(s) { return el('span', 'st ' + (s || 'public'), STL[s] || s); }
  function button(text, cls, fn) { const b = el('button', 'btn ' + (cls || 'ghost'), text); b.type = 'button'; b.onclick = async () => { b.disabled = true; try { await fn(); } finally { b.disabled = false; } }; return b; }

  async function stats(v) {
    const j = await api('stats'); v.innerHTML = '';
    const days = (j.days || []).slice().reverse();
    const today = days.length ? days[days.length - 1] : null;
    const cards = el('div', 'cards');
    [[j.total.n, 'нийт татагдалт'], [j.total.people, 'нийт хүн (ойролцоогоор)'], [today ? today.n : 0, 'сүүлийн өдөр (' + (today ? today.d.slice(5) : '-') + ')'], [j.library.n, 'Фонт сан дахь фонт']]
      .forEach(([n, l]) => { const c = el('div', 'card'); c.append(el('b', '', n), el('span', '', l)); cards.appendChild(c); });
    v.appendChild(cards);
    const ch = el('div', 'chart'); ch.appendChild(el('div', '', 'Өдөр бүрийн таталт')).style.cssText = 'font-weight:600;margin-bottom:10px';
    const bars = el('div', 'bars'); const max = Math.max(1, ...days.map(d => d.n));
    days.forEach(d => { const b = el('div', 'b'); b.style.height = Math.max(3, d.n / max * 100) + '%'; b.dataset.t = d.d.slice(5) + ' · ' + d.n + ' таталт · ' + d.people + ' хүн'; bars.appendChild(b); });
    const ax = el('div', 'axis'); ax.append(el('span', '', days.length ? days[0].d : ''), el('span', '', today ? today.d : ''));
    ch.append(bars, ax); v.appendChild(ch);
    const t = el('table'); t.innerHTML = '<thead><tr><th>Өдөр</th><th>Таталт</th><th>Хүн</th></tr></thead>';
    const tb = el('tbody'); (j.days || []).forEach(d => { const r = el('tr'); r.append(el('td', '', d.d), el('td', '', d.n), el('td', '', d.people)); tb.appendChild(r); });
    t.appendChild(tb); v.appendChild(t);
  }

  async function fonts(v) {
    const j = await api('fonts'); v.innerHTML = '';
    const items = j.items || [];
    const f = el('div', 'filter'); const only = el('input'); only.type = 'checkbox'; const lab = el('label'); lab.append(only, 'Зөвхөн нийтэд харагдаж буй');
    const dups = new Map(); items.forEach(it => { const k = (it.title || '') + '|' + (it.nickname || ''); dups.set(k, (dups.get(k) || 0) + 1); });
    f.appendChild(lab); v.appendChild(f);
    const t = el('table'); t.innerHTML = '<thead><tr><th>#</th><th>Фонт</th><th>Харагдах</th><th>Төлөв</th><th></th></tr></thead>';
    const tb = el('tbody'); t.appendChild(tb); v.appendChild(t);
    const draw = () => {
      tb.innerHTML = '';
      items.filter(it => !only.checked || it.status === 'public').forEach(it => {
        const r = el('tr');
        const c1 = el('td'); c1.append(el('div', '', '#' + it.id), el('div', 'sub', it.parent_id ? 'v → #' + it.parent_id : ''));
        const c2 = el('td'); c2.append(el('div', '', it.title || '—'));
        c2.append(el('div', 'sub', (it.nickname || '') + ' · ' + jst(it.created_at) + ' · ' + Math.round((it.size || 0) / 1024) + ' KB · ' + (it.country || '') + ' · ' + (it.who || '')));
        if (it.note) c2.append(el('div', 'sub msg', it.note));
        if (dups.get((it.title || '') + '|' + (it.nickname || '')) > 1) c2.append(el('div', 'st held', 'Давхардсан байж магадгүй'));
        const c3 = el('td', 'pv', 'Өө Үү');
        if (it.status === 'public') { const fam = 'adm' + it.id; new FontFace(fam, 'url(/api/lib/' + it.id + '/font?v=' + it.v + ')').load().then(ff => { document.fonts.add(ff); c3.style.fontFamily = fam; }).catch(() => {}); }
        else c3.style.color = 'var(--faint)';
        const c4 = el('td'); c4.appendChild(statusCell(it.status));
        const c5 = el('td', 'acts');
        const reload = () => fonts(v);
        if (it.status === 'public') c5.appendChild(button('Нуух', 'ghost', async () => { await act('font', it.id, 'hide'); reload(); }));
        else c5.appendChild(button('Нийтлэх', 'ghost', async () => { await act('font', it.id, 'show'); reload(); }));
        const view = el('a', 'btn ghost', 'Харах'); view.href = '/fontsan/#f' + (it.parent_id || it.id); view.target = '_blank'; c5.appendChild(view);
        c5.appendChild(button('Устгах', 'bad', async () => { if (confirm('#' + it.id + ' «' + it.title + '»-г бүр мөсөн устгах уу? Сэтгэгдлүүд нь ч устна.')) { await act('font', it.id, 'delete'); reload(); } }));
        r.append(c1, c2, c3, c4, c5); tb.appendChild(r);
      });
      if (!tb.children.length) { const r = el('tr'); const c = el('td', 'empty', 'Алга'); c.colSpan = 5; r.appendChild(c); tb.appendChild(r); }
    };
    only.onchange = draw; draw();
  }

  async function comments(v) {
    const j = await api('comments'); v.innerHTML = '';
    const t = el('table'); t.innerHTML = '<thead><tr><th>Фонт</th><th>Бичлэг</th><th>Огноо</th><th>Төлөв</th><th></th></tr></thead>';
    const tb = el('tbody'); t.appendChild(tb); v.appendChild(t);
    (j.items || []).forEach(c => {
      const r = el('tr');
      const c1 = el('td'); const a = el('a', '', '#' + c.font_id + ' ' + (c.font_title || '')); a.href = '/fontsan/#f' + c.font_id; a.target = '_blank'; a.style.color = 'var(--accent)'; c1.appendChild(a);
      const c2 = el('td'); c2.append(el('div', '', (c.kind === 'request' ? '✎ Засах хүсэлт ' + (c.letters || '') : '💬') + ' · ' + (c.nickname || '')), el('div', 'msg', c.message));
      if (c.fixed_by) c2.append(el('div', 'sub', '✓ ' + c.fixed_by + ' зассан'));
      const c3 = el('td', 'sub', jst(c.created_at));
      const c4 = el('td'); c4.appendChild(statusCell(c.status));
      const c5 = el('td', 'acts'); const reload = () => comments(v);
      if (c.status === 'public') c5.appendChild(button('Нуух', 'ghost', async () => { await act('comment', c.id, 'hide'); reload(); }));
      else c5.appendChild(button('Нийтлэх', 'ghost', async () => { await act('comment', c.id, 'show'); reload(); }));
      c5.appendChild(button('Устгах', 'bad', async () => { if (confirm('Энэ бичлэгийг устгах уу?')) { await act('comment', c.id, 'delete'); reload(); } }));
      r.append(c1, c2, c3, c4, c5); tb.appendChild(r);
    });
    if (!tb.children.length) { const r = el('tr'); const c = el('td', 'empty', 'Сэтгэгдэл алга'); c.colSpan = 5; r.appendChild(c); tb.appendChild(r); }
  }

  async function feedback(v) {
    const j = await api('feedback'); v.innerHTML = '';
    const t = el('table'); t.innerHTML = '<thead><tr><th>Төрөл</th><th>Санал</th><th>Огноо</th><th>Төлөв</th><th></th></tr></thead>';
    const tb = el('tbody'); t.appendChild(tb); v.appendChild(t);
    const KIND = { idea: 'Санаа', bug: 'Алдаа', other: 'Бусад' };
    (j.items || []).forEach(f => {
      const r = el('tr');
      const c1 = el('td', '', KIND[f.kind] || f.kind);
      const c2 = el('td'); c2.append(el('div', '', f.nickname || 'Нэргүй'), el('div', 'msg', f.message));
      if (f.font) c2.append(el('div', 'sub', 'Фонт: ' + f.font));
      const rp = el('div', 'reply'); const ri = el('input'); ri.placeholder = 'Хариу бичих…'; ri.value = f.reply || ''; ri.setAttribute('aria-label', 'Хариу');
      rp.append(ri, button('Хадгалах', '', async () => { await act('feedback', f.id, 'reply', { text: ri.value }); ri.style.borderColor = 'var(--ok)'; }));
      c2.appendChild(rp);
      const c3 = el('td', 'sub', jst(f.created_at));
      const c4 = el('td'); c4.appendChild(statusCell(f.status));
      const c5 = el('td', 'acts'); const reload = () => feedback(v);
      if (f.status === 'public') c5.appendChild(button('Нуух', 'ghost', async () => { await act('feedback', f.id, 'hide'); reload(); }));
      else c5.appendChild(button('Нийтлэх', 'ghost', async () => { await act('feedback', f.id, 'show'); reload(); }));
      c5.appendChild(button('Устгах', 'bad', async () => { if (confirm('Энэ саналыг устгах уу?')) { await act('feedback', f.id, 'delete'); reload(); } }));
      r.append(c1, c2, c3, c4, c5); tb.appendChild(r);
    });
  }

  if (KEY) start(); else showLogin();
})();
</script>
</body>
</html>

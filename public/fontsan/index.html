<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фонт сан — Өү</title>
<meta name="description" content="Өү хэрэгслээр монгол үсэг нэмсэн фонтууд: хэн оруулсан, юуг яаж зассан, сэтгэгдэл.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Unbounded MN";src:url(/ou-unbounded-bold.woff) format("woff");font-weight:600 900;font-display:swap;unicode-range:U+04AE-04AF,U+04E8-04E9}
  @font-face{font-family:"Unbounded MN";src:url(/ou-unbounded-medium.woff) format("woff");font-weight:100 599;font-display:swap;unicode-range:U+04AE-04AF,U+04E8-04E9}
  :root{
    --bg:#f6f6f3; --surface:#ffffff; --ink:#111113; --soft:#6b6b72; --faint:#a1a1a8;
    --line:rgba(17,17,19,.08); --line2:rgba(17,17,19,.14);
    --accent:#2f54eb; --accent-ink:#fff; --tile:#fafaf8;
    --shadow:0 1px 2px rgba(17,17,19,.04), 0 12px 40px -12px rgba(17,17,19,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d0d0f; --surface:#151518; --ink:#f3f3f5; --soft:#9d9da6; --faint:#6a6a73;
      --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
      --accent:#7b93ff; --accent-ink:#0d0d0f; --tile:#1a1a1e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 48px -16px rgba(0,0,0,.6); }
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--bg)}
  body{color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  body::before{content:"";position:fixed;inset:-20vh -10vw auto;height:70vh;pointer-events:none;z-index:0;
    background:radial-gradient(40% 50% at 25% 40%, rgba(47,84,235,.10), transparent 70%),
               radial-gradient(35% 45% at 80% 30%, rgba(255,140,90,.08), transparent 70%);filter:blur(10px)}
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:22px 24px 80px}
  nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;color:inherit;text-decoration:none}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;
    font:700 13px/1 "Unbounded MN",Unbounded,sans-serif;letter-spacing:-.04em}
  nav .links{display:flex;align-items:center;gap:6px}
  nav .navlink{font-size:13px;color:var(--soft);text-decoration:none;padding:6px 12px;border-radius:99px}
  nav .navlink:hover{color:var(--ink);background:var(--surface)}
  .page-h{text-align:center;margin-bottom:30px}
  h1{font:700 clamp(34px,5vw,52px)/1.02 "Unbounded MN",Unbounded,sans-serif;letter-spacing:-.045em;margin-bottom:14px}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{color:var(--soft);font-size:16px;max-width:560px;margin:0 auto}
  .cta{display:inline-flex;margin-top:18px;font:600 14px/1 Inter,sans-serif;border-radius:99px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);text-decoration:none}

  .tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .tools input{flex:1;min-width:220px;font:15px Inter,sans-serif;padding:12px 16px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
  .tools input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .tools .count{color:var(--faint);font-size:13px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .empty{grid-column:1/-1;text-align:center;color:var(--faint);padding:60px 20px;background:var(--surface);border:1px solid var(--line);border-radius:24px}
  .tile{position:relative;aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;transition:transform .15s, box-shadow .15s, border-color .15s}
  .tile:hover{transform:translateY(-2px);border-color:var(--line2)}
  .tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .tile .gl{flex:1;display:grid;place-items:center;font-size:clamp(46px,7vw,64px);line-height:1;letter-spacing:.02em;padding:16px 12px 0;color:var(--ink);white-space:nowrap}
  .tile .gl.loading{color:var(--faint);font:13px Inter,sans-serif;white-space:normal;text-align:center}
  .tile .meta{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--tile)}
  .tile .meta b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .meta span{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .badges{position:absolute;top:10px;right:10px;display:flex;gap:4px}
  .tile .bd{font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:99px;background:var(--tile);border:1px solid var(--line);color:var(--soft)}
  .tile .bd.mode{left:10px;right:auto}
  .tile .modeb{position:absolute;top:10px;left:10px;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:99px;background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent)}

  .modal{position:fixed;inset:0;background:rgba(10,10,12,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow-y:auto}
  .modal[hidden]{display:none}
  .sheet{position:relative;background:var(--surface);border-radius:28px;width:100%;max-width:820px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;margin-bottom:4vh}
  .sheet .close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--tile);color:var(--ink);font-size:20px;cursor:pointer;z-index:2}
  .sheet .head{display:flex;align-items:flex-start;gap:12px;padding:22px 64px 0 24px;flex-wrap:wrap}
  .sheet .t{flex:1;min-width:200px}
  .sheet .t h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .sheet .t span{color:var(--faint);font-size:13px}
  .sheet .t span i{font-style:normal;color:var(--soft);font-weight:500}
  .sheet .acts{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 0}
  .btn{font:600 13.5px/1 Inter,sans-serif;border:0;border-radius:99px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
  .btn:disabled{opacity:.45;cursor:default}
  .preview{padding:18px 24px 6px;font-size:clamp(28px,4.6vw,46px);line-height:1.18;word-break:break-word;color:var(--ink);min-height:70px;outline:none}
  .preview.loading{color:var(--faint);font:15px Inter,sans-serif;padding-top:24px}
  .alpha{padding:0 24px 12px;font-size:22px;letter-spacing:3px;color:var(--soft);word-break:break-all}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 24px 12px}
  .chip{font-size:12.5px;padding:5px 10px;border-radius:99px;background:var(--tile);border:1px solid var(--line);color:var(--soft)}
  .chip b{color:var(--ink);font-weight:600}
  .note{padding:0 24px 14px;color:var(--soft);font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
  .sec{border-top:1px solid var(--line);padding:16px 24px 18px}
  .sec h3{font-size:14px;font-weight:600;color:var(--soft);margin-bottom:10px}
  .how{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .how .r{background:var(--tile);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center}
  .how .r .g{font-size:34px;line-height:1;min-width:48px;text-align:center}
  .how .r p{font-size:13px;color:var(--soft);line-height:1.4}
  .how .r p b{color:var(--ink)}
  .cm{display:flex;flex-direction:column;gap:8px}
  .cm .c{background:var(--tile);border-radius:14px;padding:10px 14px}
  .cm .c.req{border:1px solid color-mix(in srgb, #f59e0b 45%, transparent);background:color-mix(in srgb, #f59e0b 8%, var(--tile))}
  .cm .c .m{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--faint);margin-bottom:2px;flex-wrap:wrap}
  .cm .c .m b{color:var(--ink);font-weight:600}
  .cm .c .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:color-mix(in srgb, #f59e0b 20%, transparent);color:#b45309}
  @media (prefers-color-scheme: dark){ .cm .c .tag{color:#fbbf24} }
  .cm .c .lt{font-size:20px;color:var(--ink);letter-spacing:2px}
  .cm .c .x{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
  .cstat{font-size:12.5px;color:var(--soft)}
  .cstat:empty{display:none}
  .seg{display:inline-flex;background:var(--tile);border:1px solid var(--line);border-radius:99px;padding:3px;margin-bottom:10px}
  .seg button{font:600 13px/1 Inter,sans-serif;border:0;background:transparent;color:var(--soft);padding:8px 14px;border-radius:99px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .cform{display:flex;gap:8px;flex-wrap:wrap}
  .cform input,.cform textarea{font:14.5px Inter,sans-serif;padding:10px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
  .cform input{width:150px}
  .cform input.letters{width:130px;font-size:17px;letter-spacing:2px}
  .cform input.letters[hidden]{display:none}
  .cform textarea{flex:1;min-width:200px;min-height:42px;resize:vertical}
  .cform .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .tile .bd.vb{background:var(--ink);color:var(--bg);border-color:transparent}
  .cm .c.done{border-color:color-mix(in srgb, #22c55e 45%, transparent);background:color-mix(in srgb, #22c55e 7%, var(--tile))}
  .cm .c.done .tag{background:color-mix(in srgb, #22c55e 20%, transparent);color:#15803d}
  @media (prefers-color-scheme: dark){ .cm .c.done .tag{color:#4ade80} }
  .cm .c .fx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
  .cm .c .fx .ok{font-size:13px;color:var(--soft)}
  .cm .c .fx .ok b{color:var(--ink)}
  .cm .c .fx .hint{font-size:12px;color:var(--faint)}
  .btn.sm{padding:8px 13px;font-size:12.5px}
  .vers{display:flex;flex-direction:column;gap:8px}
  .ver{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"g t a" "g w a";gap:2px 12px;align-items:center;background:var(--tile);border-radius:14px;padding:10px 12px;border:1px solid transparent}
  .ver.cur{border-color:var(--accent)}
  .ver .vg{grid-area:g;font-size:30px;min-width:56px;text-align:center;line-height:1}
  .ver .vg.loading{font:12px Inter,sans-serif;color:var(--faint)}
  .ver .vt{grid-area:t;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .ver .vt b{font-size:14px}
  .ver .vt span{font-size:12.5px;color:var(--faint)}
  .ver .vw{grid-area:w;font-size:13px;color:var(--soft)}
  .ver .btn{grid-area:a;padding:9px 12px}
  .rep{background:none;border:0;color:var(--faint);font:inherit;font-size:12px;cursor:pointer;padding:3px 6px;border-radius:8px;margin-left:auto}
  .rep:hover{color:#e5484d}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  footer{margin-top:48px;text-align:center;color:var(--faint);font-size:12.5px}
  footer a{color:inherit}
  footer .sep{margin:0 6px}
  footer .by{color:var(--soft);font-weight:500}
  @media (max-width:640px){ nav{margin-bottom:36px} .how{grid-template-columns:1fr} .cform input,.cform input.letters{width:100%} .grid{grid-template-columns:repeat(2,1fr);gap:10px} .tile .gl{font-size:42px} .tile .meta{padding:10px 12px} .modal{padding:0} .sheet{border-radius:0;min-height:100%;margin:0} }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="/"><div class="logo">ӨҮ</div>Өү</a>
    <div class="links"><a class="navlink" href="/">Фонт нэмэх</a><a class="navlink" href="/sanal">Санал хүсэлт</a></div>
  </nav>
  <section class="page-h">
    <h1>Фонт <em>сан</em></h1>
    <p class="lead">Хүмүүсийн Өү-гээр монгол үсэг нэмж, зассан фонтууд. Хэн оруулсан, ямар үсгийг юунаас яаж үүсгэсэн нь харагдана.</p>
    <a class="cta" href="/">+ Өөрийн фонтоо нэмэх</a>
  </section>
  <div class="tools">
    <label class="sr" for="q">Хайх</label>
    <input id="q" type="search" placeholder="Фонт эсвэл хүний нэрээр хайх…">
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid" aria-live="polite"><div class="empty">Ачаалж байна…</div></div>
  <footer><a href="/">Өү</a> <span class="sep">·</span> Фонт бүр оруулсан хүнийхээ баталгаагаар нийтлэгдсэн. Ашиглахаасаа өмнө лицензийг нь шалгаарай. <span class="sep">·</span> <span class="by">А.Хонгор</span></footer>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet" id="sheet"></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const SAMPLE = 'Монгол хэл бичиг · Өглөөний нар · Үүрийн гэгээ';
  const ALPHA = 'АБВГДЕЁЖЗИЙКЛМНОӨПРСТУҮФХЦЧШЩЪЫЬЭЮЯ';
  let openLatest = null, all = [], items = [], openId = null, lastFocus = null;
  // a font and its fixed versions: items holds the originals, each with .versions (oldest first)
  function group(list) {
    const byId = new Map(list.map(x => [x.id, x]));
    list.forEach(x => vOf.set(x.id, x.v));
    const roots = list.filter(x => !x.parent_id || !byId.has(x.parent_id));
    roots.forEach(r => { r.versions = [r].concat(list.filter(x => x.parent_id === r.id).sort((a, b) => a.id - b.id)); r.latest = r.versions[r.versions.length - 1]; });
    return roots;
  }
  const fmtDate = s => { try { const d = new Date(String(s).replace(' ', 'T') + 'Z'); return d.toLocaleDateString('mn-MN', { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return s; } };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const parse = it => { if (it._ch) return it._ch; try { it._ch = JSON.parse(it.changes || '{}'); } catch (e) { it._ch = {}; } return it._ch; };

  const vOf = new Map();
  const fontUrl = id => '/api/lib/' + id + '/font' + (vOf.get(id) ? '?v=' + vOf.get(id) : '');
  const faces = new Map();
  function loadFace(id, nodes) {
    const fam = 'lib' + id;
    nodes.forEach(n => n.style.fontFamily = '"' + fam + '", Inter, sans-serif');
    if (!faces.has(id)) faces.set(id, new FontFace(fam, 'url(' + fontUrl(id) + ')').load().then(ff => { document.fonts.add(ff); return true; }).catch(() => false));
    faces.get(id).then(ok => nodes.forEach(n => {
      if (ok) { n.classList.remove('loading'); if (n._txt != null) n.textContent = n._txt; return; }
      n.style.fontFamily = '';
      if (n.classList.contains('preview') || n.classList.contains('gl')) { n.textContent = 'Фонтыг ачаалж чадсангүй.'; n.classList.add('loading'); n.removeAttribute('contenteditable'); }
      else n.hidden = true;
    }));
  }
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { io.unobserve(e.target); loadFace(e.target._id, [e.target._gl]); }
  }), { rootMargin: '300px' }) : null;

  function tile(it) {
    const ch = parse(it);
    const b = el('button', 'tile'); b.type = 'button'; b.id = 'f' + it.id;
    b.setAttribute('aria-label', (it.title || 'Нэргүй фонт') + ', ' + (it.nickname || '') + ' — дэлгэрэнгүй');
    const gl = el('div', 'gl loading', 'Ачаалж байна…'); gl._txt = 'Өө Үү';
    b.appendChild(el('span', 'modeb', ch.mode === 'all' ? 'Бүх үсэг' : 'Ө Ү'));
    const meta = el('div', 'meta');
    meta.append(el('b', '', it.title || 'Нэргүй фонт'), el('span', '', (it.nickname || 'Нэргүй') + ' · ' + fmtDate(it.created_at)));
    const bd = el('div', 'badges');
    if (it.versions.length > 1) bd.appendChild(el('span', 'bd vb', 'v' + it.versions.length));
    if (it.comments) bd.appendChild(el('span', 'bd', '💬 ' + it.comments));
    if (it.requests) bd.appendChild(el('span', 'bd', '✎ ' + it.requests));
    b.append(bd, gl, meta);
    b.onclick = () => openFont(it.id);
    if (io) { b._id = it.latest.id; b._gl = gl; io.observe(b); } else loadFace(it.latest.id, [gl]);
    return b;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const shown = items.filter(it => !q || (it.title || '').toLowerCase().includes(q) || (it.nickname || '').toLowerCase().includes(q));
    const g = $('grid'); g.innerHTML = '';
    $('count').textContent = items.length ? shown.length + ' фонт' : '';
    if (!shown.length) {
      g.appendChild(el('div', 'empty', items.length ? 'Хайлтад тохирох фонт олдсонгүй.' : 'Одоохондоо фонт алга. Өү-гээр фонтоо засаад татахдаа «Фонт санд хадгалах»-ыг сонгоорой.'));
      return;
    }
    shown.forEach(it => g.appendChild(tile(it)));
  }

  function postEl(c) {
    const req = c.kind === 'request';
    const d = el('div', 'c' + (req ? ' req' : '')), m = el('div', 'm');
    m.append(el('b', '', c.nickname || 'Нэргүй'));
    if (req) m.appendChild(el('span', 'tag', 'Засах хүсэлт'));
    m.appendChild(el('span', '', fmtDate(c.created_at)));
    d.appendChild(m);
    if (req && c.letters) { const lt = el('div', 'lt', c.letters); loadFace(c.fixed_font_id || openLatest, [lt]); d.appendChild(lt); }
    d.appendChild(el('div', 'x', c.message));
    if (req) {
      const f = el('div', 'fx');
      if (c.fixed_font_id) {
        d.classList.add('done'); m.querySelector('.tag').textContent = 'Зассан';
        const s = el('span', 'ok'); s.append('✓ ', el('b', '', c.fixed_by || 'Нэргүй'), ' зассан');
        f.appendChild(s);
      } else {
        const a = el('a', 'btn primary sm', '✎ Би засъя');
        a.href = '/?fix=' + openLatest + '&req=' + c.id;
        a.title = 'Энэ фонтыг Өү дээр нээж засаад, шинэ хувилбар болгон оруулна';
        f.append(a, el('span', 'hint', 'Өү дээр нээгээд засна. Таны засвар шинэ хувилбар болж нэмэгдэнэ.'));
      }
      d.appendChild(f);
    }
    return d;
  }

  function openFont(id) {
    const it = items.find(x => x.id === id); if (!it) return;
    const ch = parse(it);
    openId = id; openLatest = it.latest.id; lastFocus = document.activeElement;
    const sh = $('sheet'); sh.innerHTML = '';
    const x = el('button', 'close', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Хаах'); x.onclick = closeFont;
    const head = el('div', 'head'), t = el('div', 't');
    const h2 = el('h2', '', it.title || 'Нэргүй фонт'); h2.id = 'mTitle';
    const by = el('span'); by.append('Оруулсан: ', el('i', '', it.nickname || 'Нэргүй'), ' · ' + fmtDate(it.created_at));
    t.append(h2, by); head.appendChild(t);
    const acts = el('div', 'acts');
    const L = it.latest;
    const dl = el('a', 'btn primary', it.versions.length > 1 ? '↓ Татах (v' + it.versions.length + ')' : '↓ Татах'); dl.href = fontUrl(L.id);
    dl.download = (it.title || 'font').replace(/[^\p{L}\p{N}\- ]/gu, '').trim().replace(/\s+/g, '-') + '-MN.woff';
    const rq = el('button', 'btn ghost', '✎ Засах хүсэлт'); rq.type = 'button';
    acts.append(dl, rq);
    const pv = el('div', 'preview loading', SAMPLE); pv.setAttribute('contenteditable', 'true'); pv.setAttribute('spellcheck', 'false');
    pv.setAttribute('aria-label', 'Жишээ текст — засаж туршиж болно');
    const al = el('div', 'alpha loading', ALPHA + ' ' + ALPHA.toLowerCase());
    const chips = el('div', 'chips');
    const addChip = (label, val) => { const s = el('span', 'chip'); s.append(label + ' ', el('b', '', val)); chips.appendChild(s); };
    addChip('Горим:', ch.mode === 'all' ? 'Бүх үсэг' : 'Зөвхөн Ө Ү');
    if (ch.added) addChip('Нэмсэн:', ch.added);
    if (ch.edited) addChip('Гараар зассан:', ch.edited);
    if (ch.faux) addChip('Танисан:', ch.faux);
    sh.append(x, head, acts, pv, al, chips);
    if (it.note) sh.appendChild(el('div', 'note', it.note));
    loadFace(L.id, [pv, al]);
    if (it.versions.length > 1) {
      const vs = el('div', 'sec'); vs.appendChild(el('h3', '', 'Хувилбарууд (' + it.versions.length + ')'));
      const vl = el('div', 'vers');
      it.versions.slice().reverse().forEach((v, i) => {
        const n = it.versions.indexOf(v) + 1, vc = parse(v);
        const r = el('div', 'ver' + (v === L ? ' cur' : ''));
        const tx = el('div', 'vt');
        tx.append(el('b', '', 'v' + n + (n === 1 ? ' · Анхны' : '')), el('span', '', (v.nickname || 'Нэргүй') + ' · ' + fmtDate(v.created_at)));
        const what = n === 1 ? (vc.added ? 'Нэмсэн: ' + vc.added : '') : (vc.edited ? 'Зассан: ' + vc.edited : 'Засвар');
        const sm = el('div', 'vw', [what, v.note].filter(Boolean).join(' — '));
        const g = el('span', 'vg loading', ''); g._txt = (vc.edited || 'Өө').slice(0, 4);
        loadFace(v.id, [g]);
        const a = el('a', 'btn ghost', '↓'); a.href = fontUrl(v.id); a.title = 'v' + n + ' татах'; a.setAttribute('aria-label', 'v' + n + ' татах');
        a.download = (it.title || 'font').replace(/[^\p{L}\p{N}\- ]/gu, '').trim().replace(/\s+/g, '-') + '-v' + n + '-MN.woff';
        r.append(g, tx, sm, a); vl.appendChild(r);
      });
      vs.appendChild(vl); sh.appendChild(vs);
    }
    const how = ch.how || {}, keys = Object.keys(how);
    if (keys.length) {
      const sec = el('div', 'sec'); sec.appendChild(el('h3', '', 'Үсэг бүрийг хэрхэн үүсгэсэн (' + keys.length + ')'));
      const g = el('div', 'how');
      keys.forEach(k => {
        const r = el('div', 'r'), gl = el('span', 'g', k + k.toLowerCase());
        const p = el('p'); p.append(el('b', '', k + ' — '), (how[k].src && how[k].src.length ? '«' + how[k].src.join(' + ') + '» → ' : ''), how[k].text || '');
        r.append(gl, p); g.appendChild(r); loadFace(L.id, [gl]);
      });
      sec.appendChild(g); sh.appendChild(sec);
    }
    // comments + edit requests
    const sec = el('div', 'sec');
    const h3 = el('h3', '', 'Сэтгэгдэл ба засах хүсэлт'); sec.appendChild(h3);
    const list = el('div', 'cm'); list.appendChild(el('div', 'cstat', 'Ачаалж байна…'));
    const seg = el('div', 'seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Төрөл');
    const bC = el('button', '', 'Сэтгэгдэл'), bR = el('button', '', 'Засах хүсэлт');
    [bC, bR].forEach(b => { b.type = 'button'; seg.appendChild(b); });
    const form = el('form', 'cform');
    const nick = el('input'); nick.placeholder = 'Нэр'; nick.maxLength = 40; nick.setAttribute('aria-label', 'Нэр');
    try { nick.value = localStorage.getItem('ou-nick') || ''; } catch (e) {}
    const letters = el('input', 'letters'); letters.placeholder = 'Үсэг: Л Ж'; letters.maxLength = 30; letters.setAttribute('aria-label', 'Засах үсгүүд');
    const msgI = el('textarea'); msgI.maxLength = 1000; msgI.setAttribute('aria-label', 'Мессеж');
    const hp = el('input', 'hp'); hp.name = 'website'; hp.tabIndex = -1; hp.autocomplete = 'off'; hp.setAttribute('aria-hidden', 'true');
    const send = el('button', 'btn primary', 'Илгээх'); send.type = 'submit';
    const st = el('div', 'cstat'); st.setAttribute('role', 'status');
    form.append(nick, letters, msgI, hp, send);
    let kind = 'comment';
    const setKind = k => {
      kind = k; bC.setAttribute('aria-pressed', k === 'comment'); bR.setAttribute('aria-pressed', k === 'request');
      letters.hidden = k !== 'request';
      msgI.placeholder = k === 'request' ? 'Юуг яаж засах хэрэгтэй вэ? Жишээ нь: Л-ийн хөл хэт нимгэн байна.' : 'Сэтгэгдэл бичих…';
    };
    bC.onclick = () => setKind('comment'); bR.onclick = () => { setKind('request'); letters.focus(); };
    setKind('comment');
    rq.onclick = () => { setKind('request'); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => letters.focus(), 300); };
    const load = async () => {
      try {
        const r = await fetch('/api/lib/' + it.id + '/comments'); const j = await r.json();
        list.innerHTML = '';
        (j.items || []).forEach(c => list.appendChild(postEl(c)));
        if (!(j.items || []).length) list.appendChild(el('div', 'cstat', 'Одоохондоо алга. Анхных нь болоорой.'));
      } catch (e) { list.innerHTML = ''; list.appendChild(el('div', 'cstat', 'Ачаалж чадсангүй.')); }
    };
    form.onsubmit = async e => {
      e.preventDefault();
      if (nick.value.trim().length < 2) { st.textContent = 'Нэрээ бичнэ үү.'; nick.focus(); return; }
      if (kind === 'request' && !letters.value.trim()) { st.textContent = 'Аль үсгийг засахыг бичнэ үү.'; letters.focus(); return; }
      if (msgI.value.trim().length < 2) { st.textContent = kind === 'request' ? 'Юуг засахыг бичнэ үү.' : 'Сэтгэгдлээ бичнэ үү.'; msgI.focus(); return; }
      send.disabled = true; st.textContent = '';
      try { localStorage.setItem('ou-nick', nick.value.trim()); } catch (e) {}
      try {
        const r = await fetch('/api/lib/' + it.id + '/comments', { method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ nickname: nick.value, message: msgI.value, kind, letters: letters.value, website: hp.value }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) st.textContent = j.error === 'rate_limited' ? 'Түр хүлээгээд дахин бичнэ үү.' : 'Илгээж чадсангүй.';
        else if (j.held) { st.textContent = 'Холбоос агуулсан тул шалгагдсаны дараа гарна.'; msgI.value = ''; }
        else {
          msgI.value = ''; letters.value = '';
          if (kind === 'request') it.requests = (it.requests || 0) + 1; else it.comments = (it.comments || 0) + 1;
          st.textContent = kind === 'request' ? 'Засах хүсэлт илгээлээ. Баярлалаа!' : '';
          await load();
        }
      } catch (e) { st.textContent = 'Илгээж чадсангүй (сүлжээ).'; }
      send.disabled = false;
    };
    sec.append(list, el('div', ''), seg, form, st);
    list.style.marginBottom = '14px';
    sh.appendChild(sec);
    load();
    $('modal').hidden = false; document.body.style.overflow = 'hidden';
    if (location.hash !== '#f' + id) history.replaceState(null, '', '#f' + id);
    x.focus();
  }
  function closeFont() {
    if ($('modal').hidden) return;
    $('modal').hidden = true; document.body.style.overflow = '';
    history.replaceState(null, '', location.pathname + location.search);
    if (openId != null) { const t = $('f' + openId); if (t) t.focus(); else if (lastFocus && lastFocus.focus) lastFocus.focus(); }
    openId = null; render();
  }
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeFont(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeFont(); });
  $('q').addEventListener('input', render);
  fetch('/api/lib').then(r => r.json()).then(j => {
    all = j.items || []; items = group(all); render();
    const m = /^#f(\d+)$/.exec(location.hash); if (m) openFont(+m[1]);
  }).catch(() => { $('grid').innerHTML = ''; $('grid').appendChild(el('div', 'empty', 'Ачаалж чадсангүй. Дахин оролдоно уу.')); });
})();
</script>
</body>
</html>

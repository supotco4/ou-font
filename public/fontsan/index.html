<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фонт сан — Өү</title>
<meta name="description" content="Өү хэрэгслээр монгол үсэг нэмсэн фонтууд: хэн оруулсан, юуг яаж зассан, сэтгэгдэл.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Unbounded MN";src:url(/ou-unbounded-bold.woff) format("woff");font-weight:600 900;font-display:swap;unicode-range:U+04AE-04AF,U+04E8-04E9}
  @font-face{font-family:"Unbounded MN";src:url(/ou-unbounded-medium.woff) format("woff");font-weight:100 599;font-display:swap;unicode-range:U+04AE-04AF,U+04E8-04E9}
  :root{
    --bg:#f6f6f3; --surface:#ffffff; --ink:#111113; --soft:#6b6b72; --faint:#a1a1a8;
    --line:rgba(17,17,19,.08); --line2:rgba(17,17,19,.14);
    --accent:#2f54eb; --accent-ink:#fff; --tile:#fafaf8;
    --shadow:0 1px 2px rgba(17,17,19,.04), 0 12px 40px -12px rgba(17,17,19,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d0d0f; --surface:#151518; --ink:#f3f3f5; --soft:#9d9da6; --faint:#6a6a73;
      --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
      --accent:#7b93ff; --accent-ink:#0d0d0f; --tile:#1a1a1e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 48px -16px rgba(0,0,0,.6); }
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--bg)}
  body{color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  body::before{content:"";position:fixed;inset:-20vh -10vw auto;height:70vh;pointer-events:none;z-index:0;
    background:radial-gradient(40% 50% at 25% 40%, rgba(47,84,235,.10), transparent 70%),
               radial-gradient(35% 45% at 80% 30%, rgba(255,140,90,.08), transparent 70%);filter:blur(10px)}
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:22px 24px 80px}
  nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;color:inherit;text-decoration:none}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;
    font:700 13px/1 "Unbounded MN",Unbounded,sans-serif;letter-spacing:-.04em}
  nav .links{display:flex;align-items:center;gap:6px}
  nav .navlink{font-size:13px;color:var(--soft);text-decoration:none;padding:6px 12px;border-radius:99px}
  nav .navlink:hover{color:var(--ink);background:var(--surface)}
  .page-h{text-align:center;margin-bottom:30px}
  h1{font:700 clamp(34px,5vw,52px)/1.02 "Unbounded MN",Unbounded,sans-serif;letter-spacing:-.045em;margin-bottom:14px}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{color:var(--soft);font-size:16px;max-width:560px;margin:0 auto}
  .cta{display:inline-flex;margin-top:18px;font:600 14px/1 Inter,sans-serif;border-radius:99px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);text-decoration:none}

  .tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .tools input{flex:1;min-width:220px;font:15px Inter,sans-serif;padding:12px 16px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
  .tools input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .tools .count{color:var(--faint);font-size:13px}

  .list{display:flex;flex-direction:column;gap:16px}
  .empty{text-align:center;color:var(--faint);padding:60px 20px;background:var(--surface);border:1px solid var(--line);border-radius:24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
  .card:target{outline:3px solid var(--accent);outline-offset:2px}
  .card .head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0;flex-wrap:wrap}
  .card .t{flex:1;min-width:200px}
  .card .t b{font-size:17px;font-weight:600;display:block}
  .card .t span{color:var(--faint);font-size:13px}
  .card .t span i{font-style:normal;color:var(--soft);font-weight:500}
  .card .acts{display:flex;gap:8px;align-items:center}
  .btn{font:600 13.5px/1 Inter,sans-serif;border:0;border-radius:99px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
  .btn:disabled{opacity:.45;cursor:default}
  .preview{padding:14px 22px 6px;font-size:clamp(28px,4.6vw,46px);line-height:1.18;word-break:break-word;color:var(--ink);min-height:70px}
  .preview.loading{color:var(--faint);font:15px Inter,sans-serif;padding-top:24px}
  .alpha{padding:0 22px 12px;font-size:22px;letter-spacing:3px;color:var(--soft);word-break:break-all}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 22px 12px}
  .chip{font-size:12.5px;padding:5px 10px;border-radius:99px;background:var(--tile);border:1px solid var(--line);color:var(--soft)}
  .chip b{color:var(--ink);font-weight:600}
  .note{padding:0 22px 12px;color:var(--soft);font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
  details{border-top:1px solid var(--line)}
  details summary{cursor:pointer;list-style:none;padding:14px 22px;font-size:14px;font-weight:500;color:var(--soft);display:flex;align-items:center;gap:8px}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:16px}
  details[open] summary::before{transform:rotate(90deg)}
  details summary:hover{color:var(--ink)}
  .how{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 22px 18px}
  .how .r{background:var(--tile);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center}
  .how .r .gl{font-size:34px;line-height:1;min-width:48px;text-align:center}
  .how .r p{font-size:13px;color:var(--soft);line-height:1.4}
  .how .r p b{color:var(--ink)}
  .cm{padding:0 22px 18px;display:flex;flex-direction:column;gap:8px}
  .cm .c{background:var(--tile);border-radius:14px;padding:10px 14px}
  .cm .c .m{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--faint);margin-bottom:2px}
  .cm .c .m b{color:var(--ink);font-weight:600}
  .cm .c .x{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
  .rep{margin-left:auto;background:none;border:0;color:var(--faint);font:inherit;font-size:12px;cursor:pointer;padding:3px 6px;border-radius:8px}
  .rep:hover{color:#e5484d}
  .cform{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .cform input,.cform textarea{font:14.5px Inter,sans-serif;padding:10px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
  .cform input{width:160px}
  .cform textarea{flex:1;min-width:200px;min-height:42px;resize:vertical}
  .cform .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .cstat{font-size:12.5px;color:var(--soft)}
  .cstat:empty{display:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  footer{margin-top:48px;text-align:center;color:var(--faint);font-size:12.5px}
  footer a{color:inherit}
  footer .sep{margin:0 6px}
  footer .by{color:var(--soft);font-weight:500}
  @media (max-width:640px){ nav{margin-bottom:36px} .how{grid-template-columns:1fr} .cform input{width:100%} }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="/"><div class="logo">ӨҮ</div>Өү</a>
    <div class="links"><a class="navlink" href="/">Фонт нэмэх</a><a class="navlink" href="/sanal">Санал хүсэлт</a></div>
  </nav>
  <section class="page-h">
    <h1>Фонт <em>сан</em></h1>
    <p class="lead">Хүмүүсийн Өү-гээр монгол үсэг нэмж, зассан фонтууд. Хэн оруулсан, ямар үсгийг юунаас яаж үүсгэсэн нь харагдана.</p>
    <a class="cta" href="/">+ Өөрийн фонтоо нэмэх</a>
  </section>
  <div class="tools">
    <label class="sr" for="q">Хайх</label>
    <input id="q" type="search" placeholder="Фонт эсвэл хүний нэрээр хайх…">
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list" aria-live="polite"><div class="empty">Ачаалж байна…</div></div>
  <footer><a href="/">Өү</a> <span class="sep">·</span> Фонт бүр оруулсан хүнийхээ баталгаагаар нийтлэгдсэн. Ашиглахаасаа өмнө лицензийг нь шалгаарай. <span class="sep">·</span> <span class="by">А.Хонгор</span></footer>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const SAMPLE = 'Монгол хэл бичиг · Өглөөний нар · Үүрийн гэгээ';
  const ALPHA = 'АБВГДЕЁЖЗИЙКЛМНОӨПРСТУҮФХЦЧШЩЪЫЬЭЮЯ';
  let items = [];
  const fmtDate = s => { try { const d = new Date(s.replace(' ', 'T') + 'Z'); return d.toLocaleDateString('mn-MN', { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return s; } };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  
  const faces = new Map();
  function loadFace(id, nodes) {
    const fam = 'lib' + id;
    nodes.forEach(n => n.style.fontFamily = '"' + fam + '", Inter, sans-serif');
    if (!faces.has(id)) faces.set(id, new FontFace(fam, 'url(/api/lib/' + id + '/font)').load().then(ff => { document.fonts.add(ff); return true; }).catch(() => false));
    faces.get(id).then(ok => nodes.forEach(n => {
      if (ok) { n.classList.remove('loading'); return; }
      n.style.fontFamily = '';
      if (n.classList.contains('preview')) { n.textContent = 'Фонтыг ачаалж чадсангүй.'; n.classList.add('loading'); n.removeAttribute('contenteditable'); }
      else if (n.classList.contains('alpha')) n.hidden = true;
    }));
  }
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { io.unobserve(e.target); loadFace(e.target._id, e.target._nodes); }
  }), { rootMargin: '300px' }) : null;

  async function report(kind, id, btn) {
    btn.disabled = true;
    try { await fetch('/api/lib/report', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind, id }) }); btn.textContent = 'Мэдэгдлээ'; }
    catch (e) { btn.disabled = false; }
  }

  async function loadComments(it, box) {
    box.innerHTML = '';
    try {
      const r = await fetch('/api/lib/' + it.id + '/comments'); const j = await r.json();
      (j.items || []).forEach(c => box.appendChild(commentEl(c)));
      if (!(j.items || []).length) box.appendChild(el('div', 'cstat', 'Сэтгэгдэл алга. Анхных нь болоорой.'));
    } catch (e) { box.appendChild(el('div', 'cstat', 'Ачаалж чадсангүй.')); }
  }
  function commentEl(c) {
    const d = el('div', 'c'), m = el('div', 'm');
    m.append(el('b', '', c.nickname || 'Нэргүй'), el('span', '', fmtDate(c.created_at)));
    const rp = el('button', 'rep', 'Мэдэгдэх'); rp.type = 'button'; rp.title = 'Зохисгүй сэтгэгдэл гэж мэдэгдэх';
    rp.onclick = () => report('comment', c.id, rp); m.appendChild(rp);
    d.append(m, el('div', 'x', c.message));
    return d;
  }

  function card(it) {
    let ch = {}; try { ch = JSON.parse(it.changes || '{}'); } catch (e) {}
    const c = el('article', 'card'); c.id = 'f' + it.id;
    const head = el('div', 'head'), t = el('div', 't');
    t.appendChild(el('b', '', it.title || 'Нэргүй фонт'));
    const by = el('span'); by.append('Оруулсан: ', el('i', '', it.nickname || 'Нэргүй'), ' · ' + fmtDate(it.created_at));
    t.appendChild(by);
    const acts = el('div', 'acts');
    const dl = el('a', 'btn primary', '↓ Татах'); dl.href = '/api/lib/' + it.id + '/font';
    dl.download = (it.title || 'font').replace(/[^\p{L}\p{N}\- ]/gu, '').trim().replace(/\s+/g, '-') + '-MN.woff';
    const rp = el('button', 'rep', 'Мэдэгдэх'); rp.type = 'button'; rp.title = 'Зөвшөөрөлгүй эсвэл зохисгүй фонт гэж мэдэгдэх';
    rp.onclick = () => report('font', it.id, rp);
    acts.append(dl, rp); head.append(t, acts);
    const pv = el('div', 'preview loading', SAMPLE); pv.setAttribute('contenteditable', 'true'); pv.setAttribute('spellcheck', 'false');
    pv.setAttribute('aria-label', 'Жишээ текст — засаж туршиж болно');
    const al = el('div', 'alpha loading', ALPHA + ' ' + ALPHA.toLowerCase());
    const chips = el('div', 'chips');
    const mode = ch.mode === 'all' ? 'Бүх үсэг' : 'Зөвхөн Ө Ү';
    const addChip = (label, val) => { const s = el('span', 'chip'); s.append(label + ' ', el('b', '', val)); chips.appendChild(s); };
    addChip('Горим:', mode);
    if (ch.added) addChip('Нэмсэн:', ch.added);
    if (ch.edited) addChip('Гараар зассан:', ch.edited);
    if (ch.faux) addChip('Танисан:', ch.faux);
    c.append(head, pv, al, chips);
    if (it.note) c.appendChild(el('div', 'note', it.note));
    const how = ch.how || {};
    const keys = Object.keys(how);
    if (keys.length) {
      const d = el('details'); const s = el('summary', '', 'Үсэг бүрийг хэрхэн үүсгэсэн (' + keys.length + ')');
      const g = el('div', 'how');
      keys.forEach(k => {
        const r = el('div', 'r'), gl = el('span', 'gl', k + k.toLowerCase());
        const p = el('p'); p.append(el('b', '', k + ' — '), (how[k].src && how[k].src.length ? '«' + how[k].src.join(' + ') + '» → ' : ''), how[k].text || '');
        r.append(gl, p); g.appendChild(r);
        loadFace(it.id, [gl]);
      });
      d.append(s, g); c.appendChild(d);
    }
    const cd = el('details'); const cs = el('summary', '', 'Сэтгэгдэл (' + (it.comments || 0) + ')');
    const cbox = el('div', 'cm'), list = el('div', '');
    list.style.display = 'flex'; list.style.flexDirection = 'column'; list.style.gap = '8px';
    const form = el('form', 'cform');
    const nick = el('input'); nick.placeholder = 'Нэр'; nick.maxLength = 40; nick.required = true; nick.setAttribute('aria-label', 'Нэр');
    try { nick.value = localStorage.getItem('ou-nick') || ''; } catch (e) {}
    const msgI = el('textarea'); msgI.placeholder = 'Сэтгэгдэл бичих…'; msgI.maxLength = 1000; msgI.required = true; msgI.setAttribute('aria-label', 'Сэтгэгдэл');
    const hp = el('input', 'hp'); hp.name = 'website'; hp.tabIndex = -1; hp.autocomplete = 'off'; hp.setAttribute('aria-hidden', 'true');
    const send = el('button', 'btn primary', 'Илгээх'); send.type = 'submit';
    const st = el('div', 'cstat'); st.setAttribute('role', 'status');
    form.append(nick, msgI, hp, send);
    form.onsubmit = async e => {
      e.preventDefault();
      if (nick.value.trim().length < 2 || msgI.value.trim().length < 2) { st.textContent = 'Нэр, сэтгэгдлээ бичнэ үү.'; return; }
      send.disabled = true; st.textContent = '';
      try { localStorage.setItem('ou-nick', nick.value.trim()); } catch (e) {}
      try {
        const r = await fetch('/api/lib/' + it.id + '/comments', { method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ nickname: nick.value, message: msgI.value, website: hp.value }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) st.textContent = j.error === 'rate_limited' ? 'Түр хүлээгээд дахин бичнэ үү.' : 'Илгээж чадсангүй.';
        else if (j.held) { st.textContent = 'Холбоос агуулсан тул шалгагдсаны дараа гарна.'; msgI.value = ''; }
        else { msgI.value = ''; st.textContent = ''; it.comments = (it.comments || 0) + 1; cs.textContent = 'Сэтгэгдэл (' + it.comments + ')'; await loadComments(it, list); }
      } catch (e) { st.textContent = 'Илгээж чадсангүй (сүлжээ).'; }
      send.disabled = false;
    };
    cbox.append(list, form, st);
    cd.append(cs, cbox); c.appendChild(cd);
    let got = false;
    cd.addEventListener('toggle', () => { if (cd.open && !got) { got = true; loadComments(it, list); } });
    const nodes = [pv, al];
    if (io) { c._id = it.id; c._nodes = nodes; io.observe(c); } else loadFace(it.id, nodes);
    return c;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const shown = items.filter(it => !q || (it.title || '').toLowerCase().includes(q) || (it.nickname || '').toLowerCase().includes(q));
    const list = $('list'); list.innerHTML = '';
    $('count').textContent = items.length ? shown.length + ' фонт' : '';
    if (!shown.length) {
      const e = el('div', 'empty', items.length ? 'Хайлтад тохирох фонт олдсонгүй.' : 'Одоохондоо фонт алга. Өү-гээр фонтоо засаад татахдаа «Фонт санд хадгалах»-ыг сонгоорой.');
      list.appendChild(e); return;
    }
    shown.forEach(it => list.appendChild(card(it)));
    if (location.hash) { const t = document.querySelector(location.hash); if (t) setTimeout(() => t.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
  }
  $('q').addEventListener('input', render);
  fetch('/api/lib').then(r => r.json()).then(j => { items = j.items || []; render(); })
    .catch(() => { $('list').innerHTML = ''; $('list').appendChild(el('div', 'empty', 'Ачаалж чадсангүй. Дахин оролдоно уу.')); });
})();
</script>
</body>
</html>
